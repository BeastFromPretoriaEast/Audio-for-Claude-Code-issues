name: Something isn't working
description: Audio for Claude Code doesn't read, reads the wrong thing, or shows an error
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer and versions
      placeholder: "Windows 11, VS Code 1.105, Audio for Claude Code 1.3.2, Claude Code 2.x"
    validations:
      required: true
  - type: dropdown
    id: voice
    attributes:
      label: Voice
      options: [Built-in voice, ElevenLabs voice]
  - type: textarea
    id: log
    attributes:
      label: Anything in View > Output > Audio for Claude Code?
      description: Please remove anything private before pasting. Never paste your ElevenLabs API key.
